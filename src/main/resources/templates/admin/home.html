<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="menu='home'">
<head>
    <title>管理メニュー</title>
</head>
<body>
    <!--
      SA-01 管理メニュー。20-SA-01 1章。
      カード3枚。PC（992px 以上）は横に並べ（col-lg-4）、スマホ・タブレットは縦に並べる。
    -->
    <main layout:fragment="content">
        <h1 class="h4 mb-4">管理メニュー</h1>
        <div class="row g-3">
            <!-- 1 店長アカウント -->
            <div class="col-12 col-lg-4">
                <div class="card h-100">
                    <div class="card-header fw-bold">👤 店長アカウント</div>
                    <div class="card-body d-flex flex-column">
                        <p class="fs-5"
                           th:text="|有効 ${managerCount.active}人／停止 ${managerCount.stopped}人|">有効 2人／停止 1人</p>
                        <a class="btn btn-outline-secondary mt-auto" th:href="@{/admin/managers}">店長アカウント管理へ</a>
                    </div>
                </div>
            </div>

            <!-- 2 最近の操作（新しい順に5件） -->
            <div class="col-12 col-lg-4">
                <div class="card h-100">
                    <div class="card-header fw-bold">📄 最近の操作</div>
                    <div class="card-body d-flex flex-column">
                        <p th:if="${#lists.isEmpty(recentLogs)}" th:text="#{I4101}">操作ログはまだありません。</p>
                        <ul class="list-unstyled" th:unless="${#lists.isEmpty(recentLogs)}">
                            <li th:each="log : ${recentLogs}">
                                <span class="text-muted small me-1" th:text="${log.createdAtLabel}">2026/10/20 18:30:00</span>
                                <span th:text="|${log.userName}（${log.actionLabel}）|">新井（シフトの公開）</span>
                            </li>
                        </ul>
                        <a class="btn btn-outline-secondary mt-auto" th:href="@{/admin/logs}">操作ログへ</a>
                    </div>
                </div>
            </div>

            <!-- 3 バックアップ -->
            <div class="col-12 col-lg-4">
                <div class="card h-100">
                    <div class="card-header fw-bold">💾 バックアップ</div>
                    <div class="card-body d-flex flex-column">
                        <p th:if="${latestBackup != null}"
                           th:text="|最後のバックアップ：${latestBackup.createdAtLabel} ${latestBackup.status.name() == 'SUCCESS' ? '成功' : '失敗'}|">
                            最後のバックアップ：2026/10/20 18:40 成功</p>
                        <div class="alert alert-warning" th:if="${backupWarning}" th:text="#{W4101}">
                            最近7日間に成功したバックアップがありません。</div>
                        <a class="btn btn-outline-secondary mt-auto" th:href="@{/admin/backups}">バックアップへ</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
