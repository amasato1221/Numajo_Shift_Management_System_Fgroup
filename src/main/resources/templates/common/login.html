<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/plain}">
<head>
    <title>ログイン</title>
</head>
<body>
    <main layout:fragment="content" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="text-center mb-4">
                    <img th:src="@{/images/logo.png}" alt="ロゴ" class="img-fluid mb-3" width="80" height="80" onerror="this.style.display='none'">
                    <h1 class="h3 fw-bold">シフト管理システム</h1>
                    <p class="text-muted mb-0" th:text="${storeName}"></p>
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="loginId" class="form-label fw-bold">ログインID</label>
                        <input type="text" id="loginId" name="loginId" class="form-control"
                               required maxlength="20" pattern="[A-Za-z0-9]{4,20}" autocomplete="username"
                               placeholder="ログインIDを入力（半角英数字4〜20文字）">
                        <div class="form-text">大文字・小文字は区別しません</div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">パスワード</label>
                        <input type="password" id="password" name="password" class="form-control"
                               required minlength="8" maxlength="64" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-success w-100">ログイン</button>
                </form>
                <div class="alert alert-danger mt-3 mb-0" th:if="${param.error}" th:text="#{E0101}"></div>
                <div class="alert alert-danger mt-3 mb-0" th:if="${param.locked}" th:text="#{E0102}"></div>
                <div class="alert alert-success mt-3 mb-0" th:if="${param.logout}" th:text="#{I0101}"></div>
                <div class="alert alert-warning mt-3 mb-0" th:if="${param.expired}" th:text="#{W0101}"></div>
                <div class="alert alert-warning mt-3 mb-0" th:if="${param.disabled}" th:text="#{W0102}"></div>
            </div>
        </div>
            </div>
        </div>
    </main>
</body>
</html>
