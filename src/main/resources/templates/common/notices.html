<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="menu='notices'">
<head>
    <title>お知らせ</title>
</head>
<body>
    <!--
      SC-02 お知らせ一覧。20-SC-02 1章。
      PC・タブレット（768px 以上）は表、スマホはカードで出す。新しい順に最大100件。
      件名はリンクのように見えるボタンで、押すと POST /notices/{id}/open（既読にして移動先へ）。
    -->
    <div layout:fragment="content" class="notices"
         th:with="hasUnread=${#lists.size(notices.?[unread]) > 0}">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 mb-0">お知らせ</h1>
            <!-- 1 すべて既読にする（未読が0件なら押せない） -->
            <form th:action="@{/notices/read-all}" method="post">
                <button type="submit" class="btn btn-outline-secondary btn-sm"
                        th:disabled="${!hasUnread}">すべて既読にする</button>
            </form>
        </div>

        <!-- 3 0件のとき -->
        <p class="notices-empty" th:if="${#lists.isEmpty(notices)}" th:text="#{I0201}">お知らせはありません。</p>

        <th:block th:unless="${#lists.isEmpty(notices)}">
            <!-- 2 お知らせの一覧（PC・タブレット：表） -->
            <div class="card d-none d-md-block">
                <div class="table-responsive">
                    <table class="table mb-0 notices-table">
                        <thead>
                            <tr>
                                <th class="notices-col-unread"><span class="visually-hidden">未読</span></th>
                                <th class="notices-col-type">種類</th>
                                <th>件名・本文</th>
                                <th class="notices-col-date">日時</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${notices}" th:classappend="${row.unread} ? 'notice-unread'">
                                <td><span class="badge bg-danger" th:if="${row.unread}">未読</span></td>
                                <td><span th:replace="~{:: typeBadge(${row})}"></span></td>
                                <td>
                                    <form th:action="@{/notices/{id}/open(id=${row.id})}" method="post">
                                        <button type="submit" class="btn btn-link p-0 text-start notice-title"
                                                th:text="${row.title}">11月前半のシフトが公開されました</button>
                                    </form>
                                    <div class="notice-body" th:text="${row.body}">11/1〜11/15 のシフトが公開されました。</div>
                                </td>
                                <td class="text-nowrap" th:text="${row.createdAtLabel}">2026/10/16 09:00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 2 お知らせの一覧（スマホ：カード） -->
            <div class="d-md-none">
                <div class="card mb-2 notice-card" th:each="row : ${notices}"
                     th:classappend="${row.unread} ? 'notice-unread'">
                    <div class="card-body py-2">
                        <div class="d-flex align-items-center gap-1 mb-1">
                            <span class="badge bg-danger" th:if="${row.unread}">未読</span>
                            <span th:replace="~{:: typeBadge(${row})}"></span>
                            <span class="notice-date ms-auto" th:text="${row.createdAtLabel}">2026/10/16 09:00</span>
                        </div>
                        <form th:action="@{/notices/{id}/open(id=${row.id})}" method="post">
                            <button type="submit" class="btn btn-link p-0 text-start notice-title"
                                    th:text="${row.title}">11月前半のシフトが公開されました</button>
                        </form>
                        <div class="notice-body" th:text="${row.body}">11/1〜11/15 のシフトが公開されました。</div>
                    </div>
                </div>
            </div>
        </th:block>
    </div>

    <!-- 2-2 種類のバッジ。色は type ごと（app.css の notice-type-xxx） -->
    <th:block th:remove="all">
        <span th:fragment="typeBadge(row)" class="badge notice-type"
              th:classappend="'notice-type-' + ${#strings.toLowerCase(row.type.name())}"
              th:text="${row.typeLabel}">公開</span>
    </th:block>
</body>
</html>
