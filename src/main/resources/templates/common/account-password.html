<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="menu='account'">
<head>
    <title>アカウント設定</title>
</head>
<body>
    <main layout:fragment="content">
        <h1 class="h4 mb-4">アカウント設定</h1>
        <div class="alert alert-warning" th:if="${loginUser.mustChangePassword}" th:text="#{W0301}"></div>
        <form th:action="@{/account/password}" th:object="${passwordChangeForm}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">ログインID</label>
                <div th:text="${loginUser.loginId}"></div>
            </div>
            <div class="mb-3">
                <label for="currentPassword" class="form-label fw-bold">今のパスワード</label>
                <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control"
                       autocomplete="current-password">
                <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}"
                     th:errors="*{currentPassword}"></div>
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label fw-bold">新しいパスワード</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control">
                <div class="form-text">半角の英字・数字・記号で8〜64文字</div>
                <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}"
                     th:errors="*{newPassword}"></div>
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-bold">新しいパスワード（確認）</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn btn-success">変更する</button>
        </form>
    </main>
</body>
</html>
