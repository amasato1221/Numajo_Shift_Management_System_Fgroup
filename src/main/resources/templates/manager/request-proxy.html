<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="menu='periods'">
<head>
    <title>希望の代理修正</title>
</head>
<body>
<!--
  SM-06-1 希望の代理修正（20-SM-06-1）。入力表は SB-03 と同じ fragments/request-table.html を使う。
  期限は見ない（店長が代わりに直す）。日付・期間・提出日時は Service / Controller が作った文字（〜Label）だけを表示する。
-->
<div layout:fragment="content">
    <h1 class="h4 mb-3" th:text="|${page.staffName}さんの希望（${page.period.periodLabel}）|">山田 太郎さんの希望（11/1〜11/15）</h1>

    <p class="mb-3">
        <span th:switch="${page.submissionState.name()}">
            <span th:case="'SUBMITTED'" class="badge text-bg-success"
                  th:text="|${page.statusLabel}（最終更新 ${page.submittedAtLabel}）|">提出済み</span>
            <span th:case="*" class="badge text-bg-danger" th:text="${page.statusLabel}">未提出</span>
        </span>
    </p>

    <div class="alert alert-info" role="alert" th:text="#{I2609}">
        店長が代わりに希望を直します。保存すると提出済みになります。
    </div>

    <form method="post"
          th:action="@{/manager/periods/{id}/requests/{userId}(id=${page.period.id},userId=${staffUserId})}">
        <input type="hidden" name="periodId" th:value="${page.period.id}">

        <div class="d-flex gap-2 mb-3">
            <button type="button" class="btn btn-outline-success btn-sm" data-fill="OK">全部○</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-fill="NG">全部×</button>
        </div>

        <div th:replace="~{fragments/request-table :: table(${page}, true)}"></div>

        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary">保存する</button>
            <a class="btn btn-outline-secondary" th:href="@{/manager/periods/{id}(id=${page.period.id})}">戻る</a>
        </div>
    </form>
</div>
</body>
</html>
