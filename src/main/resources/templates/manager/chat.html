<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="menu='chats'">
<head>
    <title>チャット</title>
</head>
<body>
<div layout:fragment="content">
    <p class="mb-2"><a th:href="@{/manager/chats}">← 一覧へ</a></p>
    <h1 class="h4 mb-3" th:text="${staff.active} ? |${staff.name}さんとのチャット| : |${staff.name}（無効）さんとのチャット|">
        山田 太郎さんとのチャット</h1>

    <div class="alert alert-warning" th:unless="${staff.active}" th:text="#{W3101}"></div>

    <div th:with="showMineSender=true">
        <div th:replace="~{fragments/chat-messages :: chat(${messages})}"></div>
    </div>

    <form th:action="@{/manager/chats/{id}(id=${staff.id})}" th:object="${chatForm}" method="post" class="mt-3">
        <div class="mb-2">
            <label for="body" class="visually-hidden">メッセージ</label>
            <textarea id="body" th:field="*{body}" class="form-control" rows="3" maxlength="500" required
                      th:disabled="${!staff.active}"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></div>
        </div>
        <button type="submit" class="btn btn-success" th:disabled="${!staff.active}">送信</button>
    </form>
</div>
</body>
</html>
