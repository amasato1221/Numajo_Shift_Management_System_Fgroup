<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/plain}">
<head>
    <title>印刷用シフト表</title>
</head>
<body>
    <!--
      SM-08 印刷用シフト表（20-SM-08）。A4横1枚。日勤・夕勤は色だけでなく記号（☀・☾）でも区別する。
      未公開の期間だけ、ななめに「下書き（未公開）」の透かしを出す。
      人数の行は「割当数/必要数」。足りないときは「▲」を付けて太字にする（色に頼らない）。
      日付・曜日・期間・出力日時は、91 の決まりに合わせて Service / Controller が作った文字（〜Label）だけを表示する。
    -->
    <div layout:fragment="content" class="print-sheet">
        <div class="print-watermark" th:unless="${published}">下書き（未公開）</div>

        <div class="no-print print-actions">
            <button type="button" class="btn btn-primary btn-sm" data-print>印刷する</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-close>閉じる</button>
        </div>

        <div class="print-head">
            <h1 class="print-title"
                th:text="|${storeName}　シフト表　${periodLabel}|">店舗　シフト表　2026/11/1(日)〜11/15(日)</h1>
            <span class="print-printed-at" th:text="|出力 ${printedAtLabel}|">出力 2026/10/20 18:40</span>
        </div>

        <table class="print-table">
            <thead>
                <tr>
                    <th class="print-name">氏名</th>
                    <th th:each="col : ${table.days}"
                        th:classappend="${col.date.dayOfWeek.value == 6} ? 'is-sat' : (${col.date.dayOfWeek.value == 7} ? 'is-sun' : '')">
                        <span th:text="${col.dayLabel}">1</span><br>
                        <span>(</span><span th:text="${col.dayOfWeekLabel}">日</span><span>)</span>
                    </th>
                    <th class="print-days">出勤日数</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${table.rows}">
                    <th class="print-name" scope="row">
                        <span th:text="${row.name}">山田 太郎</span><span class="print-trainee"
                                                                      th:if="${row.trainee}">研</span>
                    </th>
                    <td th:each="col : ${table.days}">
                        <div th:each="b : ${row.cells.get(col.date)}" class="print-badge"
                             th:classappend="${b.type.name() == 'ABSENT'} ? 'print-absent'">
                            <span th:if="${b.type.name() == 'ABSENT'}">欠</span><span
                                th:text="${b.icons}">☀</span><span th:if="${b.timeText != null}"
                                                                   th:text="${b.timeText}">13-22</span>
                        </div>
                    </td>
                    <td class="print-days" th:text="${row.workDays}">2</td>
                </tr>
            </tbody>
            <tfoot>
                <tr th:each="slotId : ${ {daySlotId, eveningSlotId} }">
                    <th class="print-name" th:text="${slotId == daySlotId} ? '☀日勤 人数' : '☾夕勤 人数'">☀日勤 人数</th>
                    <td th:each="col : ${table.days}"
                        th:with="assigned=${counts.get(col.date).get(slotId)},
                                 need=${required.get(col.date)?.get(slotId) ?: 0}">
                        <span th:classappend="${assigned lt need} ? 'print-shortage'"
                              th:text="|${assigned}/${need}${assigned lt need ? ' ▲' : ''}|">2/2</span>
                    </td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
