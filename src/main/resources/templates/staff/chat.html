<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="menu='chat'">
<head>
    <title>チャット</title>
</head>
<body>
<!--
  SB-06 チャット（店長と）（20-SB-06）。吹き出しは SM-11 と共用の fragments/chat-messages.html を使う。
  自分の発言は右・緑、店長の発言は左・白で上に送信者名。日時は ChatMessageView の createdAtLabel を出す。
  送ったあとは /staff/chat#latest へ移り、一番下（最新）を見せる。自動更新はしない。
-->
<div layout:fragment="content">
    <h1 class="h4 mb-3">店長とのチャット</h1>

    <div th:replace="~{fragments/chat-messages :: chat(${messages})}"></div>

    <form th:action="@{/staff/chat}" th:object="${chatForm}" method="post" class="mt-3">
        <div class="mb-2">
            <label for="body" class="visually-hidden">メッセージ</label>
            <textarea id="body" th:field="*{body}" class="form-control" rows="3" maxlength="500" required></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></div>
        </div>
        <button type="submit" class="btn btn-success">送信</button>
    </form>
</div>
</body>
</html>
