<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="menu='requests'">
<head>
    <title>希望を出す</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h4 mb-3">希望を出す</h1>

    <p th:if="${page == null}" th:text="#{I1301}">受付中の期間はありません。</p>

    <th:block th:if="${page != null}">
        <form method="get" th:action="@{/staff/requests}" class="mb-3">
            <label for="periodId" class="form-label">期間</label>
            <select id="periodId" name="periodId" class="form-select" data-auto-submit>
                <option th:each="option : ${page.periodOptions}" th:value="${option.id}" th:text="${option.label}"
                        th:selected="${option.id == page.period.id}">11/1〜11/15（期限 10/15）</option>
            </select>
        </form>

        <p class="mb-3">
            提出期限：<span th:text="${page.deadlineLabel}">2026/10/15 23:59</span>
            <span th:switch="${page.submissionState.name()}">
                <span th:case="'NOT_SUBMITTED'" class="badge text-bg-danger" th:text="${page.statusLabel}">未提出</span>
                <span th:case="'SUBMITTED'" class="badge text-bg-success"
                      th:text="|${page.statusLabel}（最終更新 ${page.submittedAtLabel}）|">提出済み</span>
                <span th:case="*" class="badge text-bg-secondary" th:text="${page.statusLabel}">受付終了</span>
            </span>
        </p>

        <div class="alert alert-warning" role="alert" th:unless="${page.editable}" th:text="#{W1301}">
            受付は終了しました。変更が必要なときは店長に連絡してください。
        </div>

        <form method="post" th:action="@{/staff/requests}">
            <input type="hidden" name="periodId" th:value="${page.period.id}">

            <div class="d-flex gap-2 mb-3" th:if="${page.editable}">
                <button type="button" class="btn btn-outline-success btn-sm" data-fill="OK">全部○</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-fill="NG">全部×</button>
            </div>

            <div th:replace="~{fragments/request-table :: table(${page}, ${page.editable})}"></div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary" th:disabled="${!page.editable}">提出する</button>
            </div>
        </form>

        <form method="post" class="mt-3" th:action="@{/staff/requests/cancel}"
              th:if="${page.editable and page.submissionState.name() == 'SUBMITTED'}">
            <input type="hidden" name="periodId" th:value="${page.period.id}">
            <button type="submit" class="btn btn-outline-danger" th:attr="data-confirm=#{C1301}">提出を取り消す</button>
        </form>
    </th:block>
</div>
</body>
</html>
