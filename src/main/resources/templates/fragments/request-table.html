<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
    希望の入力表。SB-03 と SM-06-1 で共用する。page：RequestPageView、editable：入力できるか。
    PC とスマホで同じ入力欄を使う（2組に分けると、同じ name のラジオが1つの組として扱われて壊れるため）。
    768px 以上は表のように1行に並べ、767px 以下は1日1枚のカードとして縦に積む。
*/-->
<th:block th:fragment="table(page, editable)">
    <div class="row g-2 fw-bold d-none d-md-flex mb-1">
        <div class="col-md-2">日付</div>
        <div class="col-md-3">日勤 ☀ 8:00-17:00</div>
        <div class="col-md-3">夕勤 ☾ 17:00-22:00</div>
        <div class="col-md-4">時間指定</div>
    </div>

    <div class="card mb-2" th:each="row, stat : ${page.days}"
         th:with="d=${#lists.size(shiftRequestForm.days) > stat.index ? shiftRequestForm.days[stat.index] : null},
                  isTime=${d != null and d.mode != null and d.mode.name() == 'TIME'}"
         data-request-day>
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-12 col-md-2 fw-bold">
                    <input type="hidden" th:name="|days[${stat.index}].workDate|" th:value="${row.workDate}">
                    <span th:text="${row.dateLabel}"
                          th:classappend="${row.workDate.dayOfWeek.name() == 'SATURDAY'}
                                          ? 'text-primary'
                                          : (${row.workDate.dayOfWeek.name() == 'SUNDAY'}
                                             ? 'text-danger')">11月1日(日)</span>
                </div>
                <div class="col-6 col-md-3">
                    <div class="small d-md-none mb-1">日勤 ☀</div>
                    <div class="btn-group" role="group" th:if="${row.dayQualified}">
                        <input type="radio" class="btn-check" th:name="|days[${stat.index}].dayShift|"
                               th:id="|day-ok-${stat.index}|" value="OK"
                               th:checked="${d != null and d.dayShift != null and d.dayShift.name() == 'OK'}"
                               th:disabled="${!editable or isTime}">
                        <label class="btn btn-outline-success" th:for="|day-ok-${stat.index}|">○</label>
                        <input type="radio" class="btn-check" th:name="|days[${stat.index}].dayShift|"
                               th:id="|day-ng-${stat.index}|" value="NG"
                               th:checked="${d != null and d.dayShift != null and d.dayShift.name() == 'NG'}"
                               th:disabled="${!editable or isTime}">
                        <label class="btn btn-outline-secondary" th:for="|day-ng-${stat.index}|">×</label>
                    </div>
                    <span class="text-muted" th:unless="${row.dayQualified}">職能なし</span>
                </div>
                <div class="col-6 col-md-3">
                    <div class="small d-md-none mb-1">夕勤 ☾</div>
                    <div class="btn-group" role="group" th:if="${row.eveningQualified}">
                        <input type="radio" class="btn-check" th:name="|days[${stat.index}].eveningShift|"
                               th:id="|evening-ok-${stat.index}|" value="OK"
                               th:checked="${d != null and d.eveningShift != null and d.eveningShift.name() == 'OK'}"
                               th:disabled="${!editable or isTime}">
                        <label class="btn btn-outline-success" th:for="|evening-ok-${stat.index}|">○</label>
                        <input type="radio" class="btn-check" th:name="|days[${stat.index}].eveningShift|"
                               th:id="|evening-ng-${stat.index}|" value="NG"
                               th:checked="${d != null and d.eveningShift != null and d.eveningShift.name() == 'NG'}"
                               th:disabled="${!editable or isTime}">
                        <label class="btn btn-outline-secondary" th:for="|evening-ng-${stat.index}|">×</label>
                    </div>
                    <span class="text-muted" th:unless="${row.eveningQualified}">職能なし</span>
                </div>
                <div class="col-12 col-md-4">
                    <div class="btn-group mb-1" role="group">
                        <input type="radio" class="btn-check js-mode-radio" th:name="|days[${stat.index}].mode|"
                               th:id="|mode-slot-${stat.index}|" value="SLOT" th:checked="${!isTime}"
                               th:disabled="${!editable}">
                        <label class="btn btn-outline-primary btn-sm" th:for="|mode-slot-${stat.index}|">枠ごと</label>
                        <input type="radio" class="btn-check js-mode-radio" th:name="|days[${stat.index}].mode|"
                               th:id="|mode-time-${stat.index}|" value="TIME" th:checked="${isTime}"
                               th:disabled="${!editable}">
                        <label class="btn btn-outline-primary btn-sm" th:for="|mode-time-${stat.index}|">時間指定</label>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <select class="form-select form-select-sm" th:name="|days[${stat.index}].startTime|"
                                th:hidden="${!isTime}" th:disabled="${!editable}" data-time-select>
                            <option value="">--</option>
                            <option th:each="o : ${timeOptions}" th:value="${o.value}"
                                    th:text="${o.label}"
                                    th:selected="${d != null and d.startTime != null
                                                   and o.value == d.startTime.toString()}">8:00</option>
                        </select>
                        <select class="form-select form-select-sm" th:name="|days[${stat.index}].endTime|"
                                th:hidden="${!isTime}" th:disabled="${!editable}" data-time-select>
                            <option value="">--</option>
                            <option th:each="o : ${timeOptions}" th:value="${o.value}"
                                    th:text="${o.label}"
                                    th:selected="${d != null and d.endTime != null and o.value == d.endTime.toString()}">22:00</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
